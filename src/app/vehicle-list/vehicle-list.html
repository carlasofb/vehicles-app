<label for="search">Pesquisar</label>
<input
  id="search"
  type="search"
  [formControl]="searchControl"
  placeholder="Matrícula, marca ou modelo…"
/>

<label for="status">Estado</label>
<select id="status" [value]="store.status()" (change)="onStatus($event)">
  <option value="all">Todos</option>
  <option value="available">Disponível</option>
  <option value="in_service">Em serviço</option>
  <option value="maintenance">Em manutenção</option>
</select>

@if (store.loading()) {
  <p>A carregar…</p>
} @else if (store.error()) {
  <p role="alert">{{ store.error() }}</p>
} @else {
  <p>{{ store.visibleVehicles().length }} de {{ store.total() }} veículos</p>
  <ul class="list">
    @for (vehicle of store.visibleVehicles(); track vehicle.id) {
      <li><app-vehicle-card [vehicle]="vehicle" (selected)="onSelected($event)" /></li>
    } @empty {
      <li>Nenhum resultado.</li>
    }
  </ul>
}
